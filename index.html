<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="x-ua-compatible" content="ie=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Bakery Shelf - AO3 Reader</title>
  <link rel="stylesheet" type="text/css" href="toasted.css" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #eee8da;
      overflow-x: hidden;
      overflow-y: hidden; /* Iframe handles its own scroll */
    }

    /* Fixed top toolbar */
    .shelf-nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 9999;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 8px 16px;
      background: #f4eedd;
      border-bottom: 2px solid #b8692a;
      box-shadow: 0 4px 10px rgba(60, 28, 8, 0.15);
      font-family: "Arial Rounded MT Bold", "Avenir Next", "Segoe UI", sans-serif;
      font-size: 13px;
      transition: transform 0.28s ease-in-out;
      will-change: transform;
    }
    .shelf-nav.nav-hidden {
      transform: translateY(-100%);
    }

    .shelf-brand {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 800;
      color: #5a2a0b;
      font-size: 1.1em;
      text-decoration: none;
      white-space: nowrap;
    }
    .shelf-controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }
    .shelf-controls select,
    .shelf-controls input[type="text"] {
      padding: 5px 10px;
      border: 1px solid #c98a4a;
      border-radius: 6px;
      background: #fffdf6;
      color: #3a2212;
      font-size: 12px;
    }
    .shelf-btn {
      padding: 5px 12px;
      border: none;
      border-radius: 6px;
      background: #fbe6a0;
      color: #4a2a0c;
      font-weight: bold;
      font-size: 12px;
      cursor: pointer;
      box-shadow: 0 2px 0 #d6ae4c;
    }
    .shelf-btn:active {
      transform: translateY(1px);
    }

    #reader-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background: transparent;
      overflow-x: hidden;
    }

    #drop-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(58, 34, 18, 0.7);
      z-index: 10000;
      align-items: center;
      justify-content: center;
      color: #fffdf6;
      font-size: 20px;
      font-weight: bold;
      pointer-events: none;
    }

    @media (max-width: 600px) {
      .shelf-nav {
        padding: 6px 10px;
        gap: 6px;
      }
      .shelf-controls {
        width: 100%;
        justify-content: space-between;
      }
      .shelf-controls select,
      .shelf-controls input[type="text"] {
        flex: 1 1 100px;
        min-width: 0;
      }
    }
  </style>
</head>
<body>

  <header class="shelf-nav" id="top-shelf">
    <a href="?" class="shelf-brand" title="Home Library">
      <span>🍞</span>
      <span>Bakery Shelf</span>
    </a>

    <div class="shelf-controls">
      <label for="story-select" style="color:#5a2a0b; font-weight:600;">Story:</label>
      <select id="story-select">
        <option value="">-- Choose Story --</option>
        <option value="Revealing_in_a_Haze.html">Revealing in a Haze</option>
        <option value="ToBeAlive">To Be Alive</option>
        <option value="tony.html">Tony Stark Really Has No Idea Who This Kid Is</option>
      </select>

      <input type="text" id="manual-url" placeholder="filename / URL..." size="14" />
      <button class="shelf-btn" id="load-btn">Load</button>

      <label class="shelf-btn" style="cursor:pointer; margin:0;">
        📂 Open
        <input type="file" id="file-input" accept=".html,.htm" style="display:none;" />
      </label>
    </div>
  </header>

  <div id="drop-overlay">Drop HTML Story File Here</div>

  <iframe id="reader-frame" name="reader-frame" sandbox="allow-same-origin allow-scripts"></iframe>

  <script>
    const nav = document.getElementById('top-shelf');
    const frame = document.getElementById('reader-frame');
    const storySelect = document.getElementById('story-select');
    const manualUrlInput = document.getElementById('manual-url');
    const loadBtn = document.getElementById('load-btn');
    const fileInput = document.getElementById('file-input');
    const dropOverlay = document.getElementById('drop-overlay');

    let lastScrollY = 0;
    function handleScroll(currentScrollY) {
      if (currentScrollY > lastScrollY && currentScrollY > 40) {
        nav.classList.add('nav-hidden');
      } else if (currentScrollY < lastScrollY) {
        nav.classList.remove('nav-hidden');
      }
      lastScrollY = Math.max(0, currentScrollY);
    }

    function attachScroll(targetDoc) {
      if (!targetDoc || !targetDoc.defaultView) return;
      targetDoc.defaultView.addEventListener('scroll', () => {
        const y = targetDoc.defaultView.scrollY || targetDoc.documentElement.scrollTop || 0;
        handleScroll(y);
      }, { passive: true });
    }

    function applySkin(doc) {
      if (!doc || !doc.head || !doc.body) return;

      // Link toasted.css if not present
      const hasLink = Array.from(doc.querySelectorAll('link[rel="stylesheet"]')).some(link => 
        (link.getAttribute('href') || '').includes('toasted.css')
      );
      if (!hasLink) {
        const link = doc.createElement('link');
        link.rel = 'stylesheet';
        link.type = 'text/css';
        link.href = 'toasted.css';
        doc.head.appendChild(link);
      }

      // Responsive mobile fixes for text overflow, tags breakout, and horizontal screen wobble
      if (!doc.getElementById('mobile-layout-fix')) {
        const style = doc.createElement('style');
        style.id = 'mobile-layout-fix';
        style.textContent = `
          /* Prevent horizontal sliding / viewport shake */
          html, body {
            overflow-x: hidden !important;
            max-width: 100vw !important;
            box-sizing: border-box !important;
          }

          #outer, #inner, #main, #work-skin, #workskin {
            max-width: 100% !important;
            box-sizing: border-box !important;
            overflow-x: clip !important;
          }

          #main {
            padding-top: 50px !important;
          }
          #outer #main #work-skin {
            padding-top: 15px !important;
          }

          /* Prevent grid items from exploding out horizontally */
          #outer #main dl.work.meta {
            max-width: 100% !important;
            box-sizing: border-box !important;
            overflow-wrap: anywhere !important;
            word-break: break-word !important;
          }
          #outer #main dl.work.meta > dt,
          #outer #main dl.work.meta > dd {
            min-width: 0 !important;
            max-width: 100% !important;
            overflow-wrap: anywhere !important;
            word-break: break-word !important;
          }
          #outer #main dl.work.meta a,
          #outer #main dl.work.meta span {
            overflow-wrap: anywhere !important;
            word-break: break-word !important;
          }

          /* Mobile layout adjustments */
          @media (max-width: 640px) {
            #main {
              padding: 8px 3vw 3em !important;
            }
            #outer #main #work-skin {
              padding-top: 0px !important;
            }

            /* Stack label (dt) and tags (dd) vertically so long tags have the entire screen width */
            #outer #main dl.work.meta {
              display: flex !important;
              flex-direction: column !important;
              padding: 2.4em 1.2em 1.2em !important;
            }
            #outer #main dl.work.meta > dt {
              text-align: left !important;
              padding: 0.6em 0 0.1em !important;
              border-bottom: none !important;
            }
            #outer #main dl.work.meta > dd {
              padding: 0 0 0.6em !important;
              border-bottom: 1px solid rgba(45, 78, 156, 0.2) !important;
            }
            #outer #main dl.work.meta dl.stats {
              display: flex !important;
              flex-wrap: wrap !important;
              gap: 4px 10px !important;
              white-space: normal !important;
            }
            #outer #main dl.work.meta dl.stats dt,
            #outer #main dl.work.meta dl.stats dd {
              display: inline !important;
              margin: 0 !important;
            }

            #workskin {
              padding: 0 2vw 2em !important;
            }
          }
        `;
        doc.head.appendChild(style);
      }

      // AO3 Scaffolding wrapper
      if (!doc.getElementById('outer')) {
        const content = doc.body.innerHTML;
        doc.body.innerHTML = `
          <div id="outer" class="wrapper">
            <div id="inner">
              <div id="main" class="works-show">
                <div id="work-skin">
                  <div id="workskin">
                    ${content}
                  </div>
                </div>
              </div>
            </div>
          </div>
        `;
      }

      attachScroll(doc);
    }

    async function loadStory(url, updateQuery = true) {
      if (!url) return;
      if (updateQuery) {
        const newUrl = new URL(window.location.href);
        newUrl.searchParams.set('story', url);
        window.history.pushState({}, '', newUrl);
      }

      manualUrlInput.value = url;
      storySelect.value = Array.from(storySelect.options).some(o => o.value === url) ? url : "";

      try {
        const res = await fetch(url);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const html = await res.text();
        renderHtml(html);
      } catch (err) {
        frame.src = url;
        frame.onload = () => {
          try { applySkin(frame.contentDocument); } catch(e){}
        };
      }
    }

    function renderHtml(htmlString) {
      const doc = frame.contentDocument || frame.contentWindow.document;
      doc.open();
      doc.write(htmlString);
      doc.close();
      applySkin(doc);
    }

    loadBtn.addEventListener('click', () => {
      const t = manualUrlInput.value.trim() || storySelect.value;
      if (t) loadStory(t);
    });
    storySelect.addEventListener('change', () => {
      if (storySelect.value) loadStory(storySelect.value);
    });
    manualUrlInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        const t = manualUrlInput.value.trim();
        if (t) loadStory(t);
      }
    });

    fileInput.addEventListener('change', (e) => {
      const f = e.target.files[0];
      if (f) {
        const r = new FileReader();
        r.onload = (ev) => renderHtml(ev.target.result);
        r.readAsText(f);
      }
    });

    window.addEventListener('dragover', (e) => { e.preventDefault(); dropOverlay.style.display = 'flex'; });
    window.addEventListener('dragleave', (e) => { if (e.clientX <= 0 || e.clientY <= 0) dropOverlay.style.display = 'none'; });
    window.addEventListener('drop', (e) => {
      e.preventDefault();
      dropOverlay.style.display = 'none';
      const f = e.dataTransfer.files[0];
      if (f && (f.name.endsWith('.html') || f.name.endsWith('.htm'))) {
        const r = new FileReader();
        r.onload = (ev) => renderHtml(ev.target.result);
        r.readAsText(f);
      }
    });

    window.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const initial = params.get('story') || 'Revealing_in_a_Haze.html';
      loadStory(initial, false);
    });
  </script>
</body>
</html>
